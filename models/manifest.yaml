project: PICS Surveillance Backend
schema_version: "1.0.0"

models:
  - name: "YOLOv8n Person Detector"
    version: "v8.0.0 (Nano)"
    role: "person_detection"
    architecture: "YOLOv8 Nano (CSPDarknet Backbone + PAN-FPN + Decoupled Head)"
    framework: "PyTorch (Ultralytics v8.x)"
    format: "pt"
    path: "models/yolov8n.pt"
    input_size: [1, 3, 640, 640]
    num_classes: 80
    target_class_ids: [0]
    target_class_names: ["person"]
    confidence_threshold: 0.25
    file_size_bytes: 6549796
    checksum_sha256: "f59b3d833e2ff32e194b5bb8e08d211dc7c5bdf144b90d2c8412c47ccfc83b36"
    status: "verified"
    hardware_acceleration:
      tensorrt_supported: true
      tensorrt_export_script: "export_yolo_tensorrt.py"
      precision: "FP16 / FP32"
      target_engine_filename: "yolov8n.engine"

  - name: "InsightFace Buffalo_L (Face Detection & Embedding)"
    version: "buffalo_l"
    role: "biometric_face_recognition"
    architecture: "RetinaFace (det_10g) + ArcFace ResNet50 (w600k_r50)"
    framework: "ONNX Runtime (CUDAExecutionProvider / CPUExecutionProvider)"
    format: "onnx"
    sub_modules:
      detection:
        model: "det_10g.onnx"
        input_size: [1, 3, 320, 320]
        threshold: 0.15
      recognition:
        model: "w600k_r50.onnx"
        embedding_dim: 512
        input_size: [1, 3, 112, 112]
        metric: "cosine_similarity"
    lock_threshold: 0.44
    ambiguous_threshold: 0.40
    ambiguous_margin: 0.03
    status: "dynamic_managed"
    notes: "Model weights are fetched and cached via InsightFace model registry on first run or placed in ~/.insightface/models/buffalo_l/."

  - name: "ByteTrack (Multi-Object Tracker)"
    version: "Integrated with Ultralytics YOLOv8"
    role: "person_tracking"
    architecture: "ByteTrack (Kalman Filter + Low-score Detection Association)"
    framework: "Ultralytics Tracker Engine"
    config_file: "config/bytetrack.yaml"
    track_lost_max_frames: 100
    status: "verified"
